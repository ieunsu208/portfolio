<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080a09" />
    <title>MILDO | 밀도</title>
    <link rel="icon" href="./assets/logo-mark.svg" type="image/svg+xml" />
    <link rel="preload" href="./assets/hero-background.png" as="image" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <header class="site-header">
          <div class="site-header__inner">
            <a class="site-logo" href="#main" aria-label="MILDO 메인으로 이동">
              <img src="./assets/logo-mark.svg" width="23" height="21" alt="" />
              <span>MILDO</span>
            </a>

            <nav class="site-nav" aria-label="주 메뉴">
              <a href="#main" aria-current="page">MAIN</a>
              <span>BRAND</span>
              <span>CATEGORY</span>
            </nav>

            <span class="site-account" aria-hidden="true">
              <img src="./assets/account-icon.svg" width="20" height="20" alt="" />
            </span>
          </div>
        </header>

        <div class="hero__content">
          <img class="hero__mark" src="./assets/hero-mark.svg" width="45" height="42" alt="" />
          <h1 id="hero-title">
            <span>짙은 연기 속,</span>
            <span>나를 각인시키는 <strong>향의 밀도</strong></span>
          </h1>
        </div>

        <p class="hero__caption">HAUTE PERFUMERY · K-HERITAGE</p>
      </section>
    </main>
  </body>
</html>
